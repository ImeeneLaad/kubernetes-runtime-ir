apiVersion: v1
kind: Namespace
metadata:
  name: juice-dev
  labels:
    # Read by the SOAR to choose the playbook: dev = automatic response.
    security.ir/environment: dev
    # Pod Security Admission: reject pods that break the "restricted" profile.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
