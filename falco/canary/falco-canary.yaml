# Falco canary: a harmless pod used ONLY to measure the sensor (clock skew,
# liveness) without touching a protected workload.
#
# Why: falco/check-clock.sh used to exec into a Juice Shop dev pod. That fired
# the real "Juice Shop - Exec into container" rule, and the dev playbook then
# (correctly) isolated and deleted the pod: every health check cost a pod.
#
# It lives in ir-system (outside the IR perimeter: not a protected namespace,
# not "monitored"). Its rule (falco/rules/ir-canary-rules.yaml) is NOTICE, below
# Sidekick's "warning" threshold for the SOAR, and is not tagged ir_response.
apiVersion: v1
kind: Pod
metadata:
  name: falco-canary
  namespace: ir-system
  labels:
    app.kubernetes.io/name: falco-canary
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: canary
      image: busybox:1.36.1
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits:   { cpu: 50m, memory: 32Mi }
