# Network isolation of the alert pipeline (namespace falco).
#
# Threat: Falcosidekick accepts any JSON POST on :2801 and forwards it to the
# SOAR. Anyone able to reach it could FORGE alerts and make the SOAR isolate
# or delete healthy workloads (an attacker-triggered denial of service). Only
# the Falco sensors may submit alerts.
#
#   falco (DaemonSet) --2801--> sidekick core --2802--> sidekick UI --6379--> redis
#
# Kubelet probes and `kubectl port-forward` are not affected (node-local, see
# docs/01-cni-validation.md and docs/04-alert-forwarding.md).
# Egress stays open: Sidekick must reach the SOAR outside the cluster.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: falco
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sidekick-accepts-falco-only
  namespace: falco
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
      app.kubernetes.io/component: core
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: falco }
      ports:
        - { protocol: TCP, port: 2801 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-accepts-sidekick-only
  namespace: falco
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
      app.kubernetes.io/component: ui
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
              app.kubernetes.io/component: core
      ports:
        - { protocol: TCP, port: 2802 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-accepts-ui-only
  namespace: falco
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
      app.kubernetes.io/component: ui-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
              app.kubernetes.io/component: ui
      ports:
        - { protocol: TCP, port: 6379 }
