# Used to demonstrate a property of the NetworkPolicy API, not a CNI bug:
# policies are ADDITIVE allow-lists. There is no "deny" and no priority.
# If any other policy allows traffic to a pod, a quarantine policy can NOT
# take it away. Test 4 shows this so the final design accounts for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-ingress-alpha
  namespace: netpol-test
spec:
  podSelector:
    matchLabels:
      app: alpha
  policyTypes: ["Ingress"]
  ingress:
    - {}
