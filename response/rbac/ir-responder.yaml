# Identity of the automated responder: least privilege, namespace-scoped.
#
# Allowed: read pods/logs/events/policies/owners (evidence + verification),
#          patch pods (labels: quarantine / orphan), delete pods (eradicate).
# NOT allowed: pods/exec, pods/attach, secrets, creating pods, changing
#          NetworkPolicies, RBAC, anything cluster-wide or in other namespaces.
# "patch" and "delete" are further restricted by admission-policy.yaml
# (labels only, never the spec; delete only quarantined pods; no un-quarantine).
apiVersion: v1
kind: Namespace
metadata:
  name: ir-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ir-responder
  namespace: ir-system
automountServiceAccountToken: false
---
# Same Role in each protected namespace (kept identical in juice-dev and juice-prod).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ir-responder, namespace: juice-dev }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ir-responder, namespace: juice-prod }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
---
# falco: read the sensor's alert log only (evidence: alerts/falco-alerts.jsonl)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ir-responder-read-alerts, namespace: falco }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ir-responder, namespace: juice-dev }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ir-responder }
subjects: [{ kind: ServiceAccount, name: ir-responder, namespace: ir-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ir-responder, namespace: juice-prod }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ir-responder }
subjects: [{ kind: ServiceAccount, name: ir-responder, namespace: ir-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ir-responder-read-alerts, namespace: falco }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ir-responder-read-alerts }
subjects: [{ kind: ServiceAccount, name: ir-responder, namespace: ir-system }]
